<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — Senhas</title>
<style>
  :root { --bg:#0f172a; --card:#111827; --text:#e5e7eb; --muted:#9ca3af; --brand:#60a5fa; --danger:#ef4444; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; font-family:system-ui,sans-serif; background:radial-gradient(900px 600px at 50% -20%,#1e293b,var(--bg)); color:var(--text); }
  body { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { width:min(430px,100%); background:rgba(17,24,39,.94); border:1px solid rgba(255,255,255,.1); border-radius:20px; padding:28px; box-shadow:0 20px 60px rgba(0,0,0,.35); }
  h1 { margin:0 0 8px; font-size:28px; }
  p { color:var(--muted); margin:0 0 24px; }
  label { display:block; margin:14px 0 6px; color:var(--muted); font-size:14px; }
  input { width:100%; padding:12px 14px; border-radius:12px; border:1px solid rgba(255,255,255,.12); background:#0b1221; color:var(--text); font-size:16px; outline:none; }
  input:focus { border-color:var(--brand); box-shadow:0 0 0 4px rgba(96,165,250,.15); }
  button { width:100%; margin-top:20px; padding:12px 14px; border:0; border-radius:12px; background:#2563eb; color:white; font-weight:700; cursor:pointer; font-size:16px; }
  button:disabled { opacity:.55; cursor:not-allowed; }
  #erro { min-height:20px; margin-top:14px; color:#fca5a5; font-size:14px; }
  #app { position:fixed; inset:0; width:100%; height:100%; border:0; display:none; background:#0f172a; }
  .topbar { position:fixed; top:0; left:0; right:0; z-index:10; display:none; justify-content:flex-end; padding:10px 14px; pointer-events:none; }
  .topbar button { pointer-events:auto; width:auto; margin:0; padding:8px 12px; font-size:13px; background:#334155; }
</style>
</head>
<body>
  <main class="card" id="loginCard">
    <h1>Área do operador</h1>
    <p>Entre com seu usuário para acessar o atendimento.</p>
    <form id="loginForm">
      <label for="username">Usuário</label>
      <input id="username" name="username" type="text" inputmode="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="nome.sobrenome" required pattern="^[a-z0-9]+\.[a-z0-9]+$">
      <label for="password">Senha</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button id="loginBtn" type="submit">Entrar</button>
      <div id="erro" role="alert" aria-live="polite"></div>
    </form>
  </main>

  <div class="topbar" id="topbar"><button id="logoutBtn" type="button">Sair</button></div>
  <iframe id="app" title="Sistema de senhas"></iframe>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDPcPaWLF4dxQ_091qiru1w9HXS05rtcz8",
    authDomain: "fila-atendimento.firebaseapp.com",
    databaseURL: "https://fila-atendimento-default-rtdb.firebaseio.com",
    projectId: "fila-atendimento",
    storageBucket: "fila-atendimento.firebasestorage.app",
    messagingSenderId: "813517035677",
    appId: "1:813517035677:web:caa3fedeac9719ff009c74"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const loginCard = document.getElementById('loginCard');
  const form = document.getElementById('loginForm');
  const loginBtn = document.getElementById('loginBtn');
  const erro = document.getElementById('erro');
  const frame = document.getElementById('app');
  const topbar = document.getElementById('topbar');
  const logoutBtn = document.getElementById('logoutBtn');

  function usernameToEmail(username) {
    return `${username.toLowerCase()}@fila-atendimento.local`;
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    erro.textContent = '';

    const username = form.username.value.trim().toLowerCase();
    if (!/^[a-z0-9]+\.[a-z0-9]+$/.test(username)) {
      erro.textContent = 'Use o formato nome.sobrenome.';
      return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = 'Entrando...';
    try {
      await signInWithEmailAndPassword(auth, usernameToEmail(username), form.password.value);
      form.reset();
    } catch (error) {
      console.error(error);
      const messages = {
        'auth/invalid-credential': 'Usuário ou senha inválidos.',
        'auth/user-not-found': 'Usuário ou senha inválidos.',
        'auth/wrong-password': 'Usuário ou senha inválidos.',
        'auth/user-disabled': 'Esta conta está desativada.',
        'auth/too-many-requests': 'Muitas tentativas. Aguarde alguns minutos e tente novamente.'
      };
      erro.textContent = messages[error.code] || 'Não foi possível entrar. Verifique a conta e tente novamente.';
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = 'Entrar';
    }
  });

  onAuthStateChanged(auth, (user) => {
    if (user) {
      loginCard.style.display = 'none';
      frame.src = './Senha-atendimento.HTML';
      frame.style.display = 'block';
      topbar.style.display = 'flex';
    } else {
      frame.src = 'about:blank';
      frame.style.display = 'none';
      topbar.style.display = 'none';
      loginCard.style.display = 'block';
    }
  });

  logoutBtn.addEventListener('click', async () => {
    await signOut(auth);
  });
</script>
</body>
</html>
